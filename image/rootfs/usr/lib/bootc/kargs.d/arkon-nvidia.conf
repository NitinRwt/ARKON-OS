# Additional kernel arguments for the arkon-nvidia variant only.
# Applied on top of arkon-base.conf.

# Enable DRM modesetting — required for Wayland with NVIDIA.
nvidia-drm.modeset=1

# Enable GSP firmware (required for Turing with 615.x driver — RTD3 support).
nvidia.NVreg_EnableGpuFirmware=1

# Enable runtime power management for the NVIDIA GPU.
# Note: RTD3 on Turing with the closed driver requires a supported laptop ACPI
# implementation. Effectiveness must be verified on target hardware (R-29, U-14).
nvidia.NVreg_DynamicPowerManagement=0x02
