# Kernel arguments for all ARKON variants.
# Format: key=value pairs, one per line. Comments and blank lines are ignored.
# Applied by bootupd/bootc at install time (V-10).

# Quiet boot — no kernel log spam on the graphical console.
quiet

# Enable systemd log on tty1 for the ARKON variant (remove for arkon-nvidia).
# rd.systemd.unit=graphical.target
