<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%"   stop-color="#0a0f1e"/>
      <stop offset="60%"  stop-color="#040810"/>
      <stop offset="100%" stop-color="#000005"/>
    </radialGradient>
    <radialGradient id="accent" cx="50%" cy="45%" r="35%">
      <stop offset="0%"   stop-color="#1a4fff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle star field dots -->
    <filter id="soft">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#accent)"/>
  <!-- Faint grid lines for depth -->
  <g stroke="#1a3a6f" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="216" x2="1920" y2="216"/>
    <line x1="0" y1="432" x2="1920" y2="432"/>
    <line x1="0" y1="648" x2="1920" y2="648"/>
    <line x1="0" y1="864" x2="1920" y2="864"/>
    <line x1="384" y1="0" x2="384" y2="1080"/>
    <line x1="768" y1="0" x2="768" y2="1080"/>
    <line x1="1152" y1="0" x2="1152" y2="1080"/>
    <line x1="1536" y1="0" x2="1536" y2="1080"/>
  </g>
</svg>
