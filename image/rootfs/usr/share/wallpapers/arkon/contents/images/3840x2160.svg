<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Deep space background gradient -->
    <radialGradient id="space" cx="50%" cy="45%" r="75%">
      <stop offset="0%"   stop-color="#06091a"/>
      <stop offset="45%"  stop-color="#030610"/>
      <stop offset="100%" stop-color="#000003"/>
    </radialGradient>
    <!-- Blue nebula glow center -->
    <radialGradient id="nebula" cx="50%" cy="42%" r="40%">
      <stop offset="0%"   stop-color="#1a3fff" stop-opacity="0.18"/>
      <stop offset="50%"  stop-color="#0a1aff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Secondary glow bottom-left -->
    <radialGradient id="nebula2" cx="20%" cy="80%" r="30%">
      <stop offset="0%"   stop-color="#6600cc" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Star glow filter -->
    <filter id="star-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="big-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="3840" height="2160" fill="url(#space)"/>
  <rect width="3840" height="2160" fill="url(#nebula)"/>
  <rect width="3840" height="2160" fill="url(#nebula2)"/>

  <!-- Horizon haze -->
  <ellipse cx="1920" cy="2400" rx="2200" ry="600"
           fill="#1a3fff" opacity="0.04"/>

  <!-- Star field — small dots at various opacities -->
  <g filter="url(#star-glow)" fill="white">
    <!-- Bright stars -->
    <circle cx="320"  cy="180"  r="1.5" opacity="0.9"/>
    <circle cx="890"  cy="340"  r="1.8" opacity="0.95"/>
    <circle cx="1540" cy="120"  r="1.4" opacity="0.8"/>
    <circle cx="2100" cy="290"  r="2.0" opacity="0.9"/>
    <circle cx="2780" cy="150"  r="1.6" opacity="0.85"/>
    <circle cx="3300" cy="400"  r="1.5" opacity="0.8"/>
    <circle cx="560"  cy="620"  r="1.3" opacity="0.7"/>
    <circle cx="1200" cy="480"  r="1.6" opacity="0.9"/>
    <circle cx="1800" cy="560"  r="1.2" opacity="0.75"/>
    <circle cx="2450" cy="510"  r="1.8" opacity="0.88"/>
    <circle cx="3100" cy="600"  r="1.4" opacity="0.72"/>
    <circle cx="200"  cy="900"  r="1.3" opacity="0.65"/>
    <circle cx="740"  cy="820"  r="1.5" opacity="0.78"/>
    <circle cx="1350" cy="760"  r="1.1" opacity="0.6"/>
    <circle cx="2000" cy="840"  r="1.7" opacity="0.82"/>
    <circle cx="2680" cy="780"  r="1.3" opacity="0.7"/>
    <circle cx="3400" cy="850"  r="1.6" opacity="0.76"/>
    <!-- Dim background stars -->
    <circle cx="450"  cy="250"  r="0.8" opacity="0.45"/>
    <circle cx="980"  cy="190"  r="0.7" opacity="0.4"/>
    <circle cx="1680" cy="380"  r="0.9" opacity="0.5"/>
    <circle cx="2300" cy="200"  r="0.8" opacity="0.42"/>
    <circle cx="3050" cy="280"  r="0.7" opacity="0.38"/>
    <circle cx="650"  cy="510"  r="0.8" opacity="0.48"/>
    <circle cx="1480" cy="650"  r="0.9" opacity="0.52"/>
    <circle cx="2560" cy="420"  r="0.7" opacity="0.4"/>
    <circle cx="3200" cy="490"  r="0.8" opacity="0.44"/>
  </g>

  <!-- ARKON wordmark — large, centered, subtle -->
  <text x="1920" y="1180"
        font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="220" font-weight="700" letter-spacing="60"
        text-anchor="middle"
        fill="#1a3fff" opacity="0.06">ARKON</text>

  <!-- Thin accent line under wordmark -->
  <rect x="1620" y="1210" width="600" height="1.5"
        fill="#3060ff" opacity="0.15" rx="1"/>
</svg>
