# bootc-image-builder config for anaconda-iso type.
# Used by: build/scripts/build-iso.sh
#
# Creates an Anaconda installer ISO that embeds the ARKON bootc image.
# The user selects a target disk; Anaconda installs the image via bootc.

[[customizations.user]]
name = "arkon"
password = "arkon"
groups = ["wheel"]
