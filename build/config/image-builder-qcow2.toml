# image-builder configuration for QCOW2 disk image generation.
# Used by: build/scripts/build-qcow2.sh
#
# This creates a pre-installed QCOW2 suitable for booting in QEMU.
# The default user is created for VM validation only — not for production images.
#
# Format: osbuild image-builder blueprint (TOML).
# Reference: https://osbuild.org/docs/on-premises/

[customizations]

[customizations.kernel]
append = ""

# Default user for VM validation testing.
# Change or remove this for production image builds.
[[customizations.user]]
name     = "arkon"
password = "arkon"
groups   = ["wheel"]

[customizations.services]
enabled  = ["sddm.service", "NetworkManager.service"]
disabled = []
