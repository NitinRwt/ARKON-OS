name: Build ARKON ISO

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: 'Image variant (arkon or arkon-nvidia)'
        required: false
        default: 'arkon'

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install podman and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman qemu-utils

      - name: Set up podman storage
        run: |
          mkdir -p ~/.config/containers
          cat > ~/.config/containers/storage.conf <<'EOF'
          [storage]
          driver = "overlay"
          runroot = "/run/user/1001/containers"
          graphroot = "/home/runner/.local/share/containers/storage"
          EOF

      - name: Build ARKON container image
        run: |
          VARIANT="${{ github.event.inputs.variant || 'arkon' }}"
          bash build/scripts/build-image.sh "${VARIANT}"

      - name: Build installer ISO
        run: |
          VARIANT="${{ github.event.inputs.variant || 'arkon' }}"
          mkdir -p artifacts/iso artifacts/checksums artifacts/logs
          bash build/scripts/build-iso.sh "${VARIANT}"

      - name: Verify artifacts
        run: bash build/scripts/verify.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkon-iso-${{ github.sha }}
          path: |
            artifacts/iso/*.iso
            artifacts/checksums/*.sha256
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: artifacts/logs/
          retention-days: 7
