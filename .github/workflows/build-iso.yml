name: Build ARKON Disk Image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: 'Image variant (arkon or arkon-nvidia)'
        required: false
        default: 'arkon'

# Builds a QCOW2 disk image directly bootable in QEMU, VirtualBox, and VMware.
# anaconda-iso requires bootc-image-builder to have Fedora 45 distro data
# (repo definitions for the Anaconda installer environment) which the current
# CentOS-based bib container does not ship. QCOW2 has no such dependency —
# it repackages the already-built container layers into a disk image.

jobs:
  build-disk-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install podman and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman qemu-utils

      - name: Build ARKON container image
        run: |
          VARIANT="${{ github.event.inputs.variant || 'arkon' }}"
          sudo bash build/scripts/build-image.sh "${VARIANT}"

      - name: Build QCOW2 disk image
        run: |
          VARIANT="${{ github.event.inputs.variant || 'arkon' }}"
          sudo mkdir -p artifacts/qcow2 artifacts/checksums artifacts/logs
          sudo bash build/scripts/build-qcow2.sh "${VARIANT}"

      - name: Fix artifact ownership
        run: sudo chown -R "$(id -u):$(id -g)" artifacts/

      - name: Verify artifacts
        run: bash build/scripts/verify.sh

      - name: Upload QCOW2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkon-qcow2-${{ github.sha }}
          path: |
            artifacts/qcow2/*.qcow2
            artifacts/checksums/*.sha256
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: artifacts/logs/
          retention-days: 7
